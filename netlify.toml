# Deliberately no build command.
#
# The build runs locally: scripts/build.mjs calls external APIs (DEM elevation,
# BRouter routing) and its outputs — site/route-data.json, site/resolve.js and
# site/gpx/ — are committed. So a deploy can never fail because a third party is
# down or rate-limited.
#
# Deployment is `npm run deploy`, which builds, runs the tests, and pushes site/
# with the Netlify CLI. The GitHub repository is source history only and is NOT
# connected for automatic deploys.
#
# If you ever do connect it: site/config.js carries the OS Maps key and is
# gitignored, so a git-triggered deploy would fall back to OpenStreetMap tiles.
# To fix that you would set OS_MAPS_KEY in the Netlify site environment and add
# `command = "npm run build"` below.
[build]
  publish = "site"

# "/*.gpx" only matches the site root; the files live under /gpx/<route>/.
[[headers]]
  for = "/gpx/*"
  [headers.values]
    Content-Type = "application/gpx+xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/route-data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
