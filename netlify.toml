# The build runs locally, not on Netlify. scripts/build.mjs calls external APIs
# (DEM elevation, BRouter routing) and its outputs — site/route-data.json and
# routes/*/gpx-exports/ — are committed. Netlify only serves the static site, so
# a deploy can never fail because a third-party API is down or rate-limited.
[build]
  publish = "site"

# "/*.gpx" only matches the site root; the files live under /gpx/<route>/.
[[headers]]
  for = "/gpx/*"
  [headers.values]
    Content-Type = "application/gpx+xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/route-data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
